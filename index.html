<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Uttam Patel · AI Engineer & Data Scientist</title>
    <meta
      name="description"
      content="Uttam Patel is an AI engineer and data scientist who builds AI that ships: machine learning models, LLM agents and automations, SaaS products and data systems, from idea to production."
    />
    <meta name="theme-color" content="#07090B" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Uttam Patel · I build AI that ships." />
    <meta
      property="og:description"
      content="AI engineer & data scientist. ML models, LLM agents and automations, SaaS products and data systems, from idea to production."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- fonts are self-hosted latin subsets with font-display: swap (see styles/base.css). Not
         preloaded on purpose: on slow connections they would compete with the critical CSS/JS. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Uttam Patel",
        "jobTitle": "AI Engineer & Data Scientist",
        "description": "Builds machine learning models, LLM agents and automations, SaaS products and data-driven systems, from idea to production.",
        "email": "mailto:utampipaliya@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Ahmedabad", "addressRegion": "Gujarat", "addressCountry": "IN" },
        "knowsAbout": ["Machine learning", "Deep learning", "Large language models", "AI agents", "Workflow automation", "SaaS", "Data engineering", "Algorithmic trading", "Blockchain"],
        "sameAs": ["https://huggingface.co/Uttampatel"]
      }
    </script>
    <script>
      // Apply the saved temperature (theme) before first paint so there is no flash.
      try {
        var s = JSON.parse(localStorage.getItem('temperature') || 'null')
        if (s && s.vars) {
          var r = document.documentElement
          for (var k in s.vars) r.style.setProperty(k, s.vars[k])
          r.dataset.theme = s.theme === 'light' ? 'light' : 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Uttam Patel · AI Engineer &amp; Data Scientist. I build AI that ships. Email: utampipaliya@gmail.com
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
